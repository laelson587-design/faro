<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota — quem visitar hoje</title>
<meta name="theme-color" content="#101216">
<link rel="stylesheet" href="estilo.css?v=2">
</head>
<body>

<!-- Escolher onde e o quê. Duas perguntas, e nenhuma delas pede CNAE:
     ninguém sabe que lanchonete é 5611, e quem soubesse não precisaria disto. -->
<section id="tela-escolha" class="tela ativa">
  <div class="corpo">
    <h1>Rota</h1>
    <p class="chamada">Quem visitar hoje, e por quê.</p>

    <label class="campo">
      <span class="rotulo">Sua cidade</span>
      <!-- Campo de digitar, e não uma lista: são 645 cidades, e a roleta do
           celular obriga a rolar até achar. Digitar "ribe" resolve. O valor
           escolhido fica no `data-cod`; o texto é só o que a pessoa lê. -->
      <input id="cidade-busca" type="text" autocomplete="off" enterkeyhint="search"
             placeholder="digite a cidade…" data-cod="">
      <div id="cidade-lista" class="sugestoes oculto"></div>
    </label>

    <h3>O que você vende</h3>
    <div id="profissoes" class="profissoes"></div>

    <!-- Só aparece nas cidades grandes. Numa cidade normal perguntar a zona
         seria uma pergunta a mais sem resposta útil. -->
    <label class="campo oculto" id="campo-zona">
      <span class="rotulo">Qual região</span>
      <select id="zona"></select>
    </label>

    <button id="buscar" class="principal" disabled>Montar o roteiro</button>
    <p class="dica" id="peso"></p>

    <p class="dica rodape-fonte">
      Dados abertos da Receita Federal, empresas <b>ativas</b>.
      <span id="base-mes"></span>
      Nada é enviado a lugar nenhum: a busca roda neste aparelho.
    </p>
  </div>
</section>

<!-- O roteiro. Agrupado por bairro porque um dia de visita é um bairro, não
     uma cidade — e ordenado por rua, para a caminhada fazer sentido. -->
<section id="tela-rota" class="tela">
  <header class="topo">
    <button id="voltar" class="icone" aria-label="Voltar">←</button>
    <div>
      <h2 id="rota-titulo"></h2>
      <p id="rota-sub" class="sub"></p>
    </div>
  </header>

  <div class="corpo">
    <div class="filtros">
      <label class="campo">
        <span class="rotulo">Bairro</span>
        <select id="bairro"></select>
      </label>
      <label class="marcavel">
        <input id="so-telefone" type="checkbox">
        <span>Só com telefone</span>
      </label>
      <label class="marcavel">
        <input id="so-novas" type="checkbox">
        <span>Abertas nos últimos 2 anos</span>
      </label>
      <label class="marcavel">
        <input id="esconder-visitadas" type="checkbox" checked>
        <span>Esconder as que já visitei</span>
      </label>
    </div>

    <p id="contagem" class="contagem"></p>

    <!-- Antes da lista, a escolha do bairro. Abrir com 35 mil empresas é
         uma parede: ninguém trabalha assim, e a primeira reação é fechar.
         Um bairro por vez cabe num dia. -->
    <div id="escolha-bairro" class="escolha-bairro oculto">
      <p class="dica">São muitas para uma lista só. Comece por um bairro —
         dá para trocar depois.</p>
      <div id="bairros-cartoes" class="bairros-cartoes"></div>
      <button id="ver-todos" class="secundario">Ver a cidade inteira mesmo assim</button>
    </div>

    <div id="lista"></div>

    <!-- A rota do dia. Aparece quando há empresa marcada, e some quando
         não há: botão sem função na tela é ruído. -->
    <div id="barra-rota" class="barra-rota oculto">
      <span id="rota-quantas"></span>
      <button id="abrir-rota" class="principal">Traçar rota</button>
      <button id="limpar-rota" class="secundario">Limpar</button>
    </div>

    <button id="mais" class="secundario oculto">Mostrar mais</button>
  </div>
</section>

<div id="aviso" class="aviso oculto"></div>

<script src="ramos.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
